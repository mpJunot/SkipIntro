<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkipIntro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1><span class="mark">&#9197;</span> SkipIntro</h1>
      <p class="platforms">Crunchyroll &middot; Netflix &middot; Disney+</p>
      <div class="card intro">
        <div class="card-head">
          <h4>Auto skip intro</h4>
          <label class="switch">
            <input type="checkbox" id="skipIntro" placeholder="button.skip-intro" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div class="card credits">
        <div class="card-head">
          <h4>Auto skip credits</h4>
          <label class="switch">
            <input type="checkbox" id="skipCredits" placeholder="button.skip-credits" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <label class="row delay">
        <span>Delay before click</span>
        <div class="field">
          <input type="number" id="skipDelayMs" min="0" max="10000" step="100" />
          <span class="unit">ms</span>
        </div>
      </label>
      <div class="exclusion">
        <h4>Excluded URLs <span id="excludedCount">0</span></h4>
        <input type="text" id="add-url" placeholder="https://www.netflix.com/watch/..." />
        <ul class="exclusion-list" id="excludedUrls"></ul>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
